# Room pages of this one-shot: special rooms that get a page of their own. Shown on webapp/rooms.html.
#
# id:          unique kebab-case id within this one-shot
# name:        display name
# location:    id of the location in locations.yaml the room belongs to
# mural:       writing on a wallpapered wall painted over with black strokes (shared/js/mural.js); show it to the players
#   lines:     the words, one line each
#   moving:    words that strain as if they wanted to change position (optional)
# pictures:    developed photographs (shared/js/mural.js), each with
#   caption:   handwritten label on the photo
#   shows:     what the picture shows; drawn so far: eye (a giant eye that opens when you look at it)
# description: what the players see, one line each
# items:       what can be found here, one line each
# gm_notes:    hidden truth, one line each
# open:        open questions

