# Room pages of this one-shot: special rooms that get a page of their own. Shown on webapp/rooms.html.
#
# id:          unique kebab-case id within this one-shot
# name:        display name
# location:    id of the location in locations.yaml the room belongs to
# mural:       writing on a wallpapered wall painted over with black strokes (shared/js/mural.js); show it to the players
#   lines:     the words, one line each
#   moving:    words that twitch as if they wanted to change position (optional)
#   eye:       true = a minimal sprayed eye above the words that follows the cursor (optional)
# description: what the players see, one line each
# items:       what can be found here, one line each
# gm_notes:    hidden truth, one line each
# open:        open questions

- id: janitors-closet
  name: Janitor's closet
  location: lab
  mural:
    lines:
      - Can you see it?
      - it sees you
      - and me
      - What is left of you in the darkness?
    moving: [darkness]
    eye: true
  description:
    - The hidden room behind the black wall in the labs.
    - A giant wall, painted over with black paint. Above the words a simple eye is sprayed on, which seems to follow whoever looks at it. Words are written on the darkness, and the word "darkness" seems to move, as if it wanted to change position.
  items:
    - Some items. To be defined.
  gm_notes: []
  open:
    - Which items are in the closet.
    - Who painted the wall.

- id: camera-development
  name: Camera development
  location: lab
  description:
    - A test room in the labs. Notes describe how they developed a film that can expose and capture what is in Mu light; it was immensely slow and expensive to produce.
    - Developed pictures of the other test rooms, of the PCR and of the pitch black test room.
    - The picture of the PCR shows a giant eye. When a player looks at it, the eye opens.
  items:
    - The picture of the PCR, an artifact by itself (lore object pcr-photograph).
    - The picture of the pitch black test room, showing the dead remains of a scientist with a security card around their neck.
  gm_notes: []
  open:
    - What the eye is, and what happens after it opens.
