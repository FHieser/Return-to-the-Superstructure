lore_changes:
  - "The bottom of the cavity around the North Entry is covered in Κ-Coolant, frozen into a sea of ice and frost; the road runs just above it."

premise: ""                 # the pitch, read to the players or summarised (Markdown)

# GM text, in order.
sections:
  - heading: The players
    body: |
      The players are members of the expedition: the off-the-record government team that opened the north passage into the Superstructure on October 10, 2042.
  - heading: The base
    body: |
      The expedition's base is the **North Entry**: the point on the Superstructure wall north-west of Maroon (Substructure 14) and north-east of Magenta (Substructure 15). From here the players set out for Maroon.
  - heading: What the players learn
    body: |
      The players start with very little knowledge of the Superstructure.

      Over the session they learn the basics: what Periphery Catalyst Reactors (PCRs) are, and that peripheries exist. What the peripheries really are stays hidden, or comes through only in heavily restricted fragments.
  - heading: Goals
    body: |
      - Gather information on the current contents of the substructure
      - Look for survivors
      - Check whether the trams or roadways are still usable
      - See whether the PCR is still online and functional
  - heading: The main challenge
    body: |
      Mu light sources inside Maroon turn parts of the substructure pitch black. Sight, cameras and optics fail there; the players have to find their way by sound, touch, smell and instruments that do not rely on sight.
  - heading: "GM: Something in the dark"
    body: |
      Something is hiding in the dark zones. (To be defined.)
  - heading: Information
    body: |
      The scavenged information on the place says that Maroon was researching Periphery Mu.

open: []
