  # Reproduced from Lab Maroon.drawio, on the same grid as the storage: the labs lie right above the hall.
  - id: lab
    name: Labs (SB14, one floor up)
    view: [-8.5, -11, 12.5, 7.5]
    regions:
      - { id: lobby, name: Lobby, color: "#c4919b" }
      - { id: front, name: Before the security door, color: "#8a3d4d" }
      - { id: tests, name: Test area, color: "#64202f" }
      - { id: pcr, name: PCR control room, color: "#44101c" }
    zones:
      # Barnacles (red): spread from the Lambda denizen tests. No tips of their own: they are part of the rooms they sit in
      - kind: barnacle
        points: [[-1.66, -6.03], [1.63, -9.32], [3.60, -7.35], [0.31, -4.06]]
      - kind: barnacle
        points: [[-3.78, -2.65], [-2.56, -3.87], [-1.46, -2.77], [-2.68, -1.55]]
      - kind: barnacle
        points: [[-1.37, -4.80], [-0.78, -4.21], [-1.53, -3.46], [-2.12, -4.05]]
    blocks:
      # Hallways (no tips); the security corridors are drawn as part of their security doors
      - { region: front, kind: corridor, at: [4.55, -3.68], size: [6.40, 1.40], angle: -45 }
      - { region: tests, kind: corridor, at: [-0.52, 1.21], size: [6.40, 1.40], angle: 45 }
