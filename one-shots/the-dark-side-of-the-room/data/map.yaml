      - { region: lobby, kind: room, at: [5.30, -9.16], size: [2.00, 1.60], angle: -45, label: "Toilet", name: Toilet }
      - { region: lobby, kind: room, at: [8.72, -6.03], size: [1.20, 1.20], angle: -45, name: Broken elevator, note: "The elevators do not work here." }
      # Front part
      - { region: front, kind: room, at: [2.94, -4.69], size: [5.66, 2.20], angle: -45, label: "Office", name: Office, location: lab, note: "The players can go through the office to get round the black wall." }
      - { region: front, kind: room, at: [0.97, -6.69], size: [5.66, 3.40], angle: -45, label: "Archive", name: Archive, location: lab, note: "Mostly unusable after the Lambda outbreak. What can still be found here: to be defined. Barnacles sit in here since the outbreak." }
      - { kind: room, at: [4.72, -3.91], size: [1.40, 1.40], angle: -45, mu: true, label: "Black\nwall", name: Black wall, location: lab, note: "A wall of pitch black across the hallway, right after the lobby. The players can go round it through the office. Behind it lies the hidden janitor's closet." }
      - { region: front, kind: room, at: [5.98, -2.71], size: [1.60, 2.00], angle: -45, hidden: true, label: "Janitor's\ncloset", name: Janitor's closet (hidden), location: lab, note: "A secret room behind the black wall. A giant wall painted with black paint, with words on it whose letters seem to shift (see the Rooms page), and some items." }
      - { region: front, kind: room, at: [4.36, -1.04], size: [2.20, 2.00], angle: -45, label: "Break\nroom", name: Break room, location: lab }
      - { kind: gate, group: test-door, at: [1.64, -0.71], size: [2.20, 1.80], angle: 45, label: "Security\ndoor", name: Security door to the test area, location: lab, note: "Normally closes off the test area. The breach the Lambda creatures chewed opens a way round it." }
      # Test area
      - { kind: breach, group: lambda, at: [-1.45, -4.13], size: [1.04, 1.33], angle: 45 }   # the breach, part of the Lambda tests
      - { region: tests, kind: room, group: lambda, at: [-2.62, -2.71], size: [2.20, 2.00], angle: -45, label: "Lambda\ntests", name: Lambda denizen tests, location: lab, lore: lambda, note: "Tests on Lambda denizens. They chewed themselves through the wall into the archive and broke out. The breach opened up the test area, which is normally closed off by the security door. Barnacles sit in here and in the breach." }
      - { region: tests, kind: room, at: [-0.76, -1.67], size: [2.20, 2.00], angle: -45, label: "Dead\nplants", name: Dead plantation room, location: lab, note: "Plants that were grown under Mu light only, now all dead." }
      - { kind: room, at: [-4.20, -1.13], size: [2.20, 2.00], angle: -45, mu: true, label: "Pitch\nblack", name: Pitch black test room, location: lab, lore: mu, note: "A test room with a Mu light source in the ceiling, probably a Mu-0019 light emitter built in. They switched it on and off to test things. During a periphery spike (something that can just happen with PCRs), the scientist inside got grilled. Its door has complete blackness behind it." }
      - { region: tests, kind: room, at: [2.38, 1.55], size: [2.20, 2.00], angle: -45, label: "Mu-0019", name: Mu-0019 light emitter, location: lab, lore: mu, note: "Something the PCR produced that gives off Mu light by itself, within a certain radius. Extremely hot, and it gives cancer. A sphere was built around it, but one side fell off, and a beam can be seen coming out. Notes here mention a Mu-0019 emitter built into the ceiling of the pitch black test room." }
      - { region: tests, kind: room, at: [2.16, 4.53], size: [2.20, 2.00], angle: -45, label: "Meter\ntest", name: Periphery meter test, location: lab, lore: periphery-scanner, note: "Tests on the periphery scanner, one of the last experiments. It was left behind here because of its quirks." }
      - { region: tests, kind: room, at: [-3.36, 0.96], size: [2.20, 2.00], angle: -45, label: "Observation", name: Observation room, location: lab, note: "Observation room for the pitch black test room next door. A window looks into it, but shows only black. On the wall, a picture of how the room should look, for comparison. A description says that someone entered the room and was never heard from again; the room has been off limits since. The logs mention that the camera development team took a photo of the room to look into it." }
      - { region: tests, kind: room, at: [-0.14, 4.01], size: [2.20, 2.00], angle: -45, label: "Camera\ndevelopment", name: Camera development, location: lab, note: "Notes describe how they developed a film that can expose and capture what is in Mu light - immensely slow and expensive to produce. Developed pictures of the other test rooms and of the PCR (a giant eye that opens when you look at it, an artifact by itself); the one of the pitch black room shows the dead remains of a scientist, with a security card around their neck." }
      # Way to the PCR
      - { kind: gate, group: pcr-door, at: [-1.60, 2.43], size: [2.20, 1.80], angle: 45, label: "PCR\ndoor", name: PCR security door, location: security-door, note: "The security door into the PCR control room. How the players open it: to be defined." }
      - { region: pcr, kind: room, at: [-4.76, 3.78], size: [5.52, 1.93], angle: 45, label: "PCR\ncontrol room", name: PCR control room, location: pcr, note: "Behind the PCR security door. The only way up to the PCR, which lies one floor above." }
      # Doors between the rooms
      - { kind: door, at: [6.81, -5.96], size: [0.8, 0.22], angle: 45 }    # lobby / hallway
      - { kind: door, at: [5.87, -8.59], size: [0.8, 0.22], angle: -45 }   # lobby / toilet
