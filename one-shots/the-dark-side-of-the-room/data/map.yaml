      - { kind: door, at: [3.16, -3.32], size: [0.8, 0.22], angle: -45 }   # hallway / office, behind the black wall
      - { kind: door, at: [1.17, -4.48], size: [0.8, 0.22], angle: -45 }   # office / archive
      - { kind: door, at: [3.16, -6.47], size: [0.8, 0.22], angle: -45 }   # office / archive
      - { kind: door, at: [5.23, -3.40], size: [0.8, 0.22], angle: -45 }   # black wall / janitor's closet
