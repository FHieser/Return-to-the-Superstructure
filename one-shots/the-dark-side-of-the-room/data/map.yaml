# Maps of this one-shot. Shown on webapp/map.html; GM tokens can be dragged around on them.
# Reproduced from the GM's draw.io sketches (Road to Maroon.drawio, Storage Maroon.drawio, Lab Maroon.drawio), which stay next to this file.
#
# Coordinates are [x, y] in grid units (x to the right, y down). The road map uses the lore's
# cavity grid (lore/data/map.yaml) scaled by 8, with the North Entry at [0, 0]: SB14 Maroon is at [8, 8].
#
# sections: one map each (switched with the buttons above the map when there are several)
#   id, name
#   view:    [x0, y0, x1, y1] area shown at first (optional; otherwise everything is fitted)
#   ground:  coolant (the frozen Κ-Coolant sea) | empty = dark floor
#   labels:  big faint text on the ground: { text, at, size, rotate }
#   wall_label: legend name of the walls (e.g. Superstructure wall)
#   regions: coloured parts of a floor, listed in the legend: { id, name, color }; blocks join one with region: <id>
#   walls:   lines of the facility wall, each a list of points
#   walkways: walkways up top: { points, label, label_t (0-1 along the line), label_offset, location | lore, note }
#   zones:   filled areas: { points, kind: floor | coolant | dark | mu | barnacle (red, on the ceiling), label, label_at, location | lore, note }
#   blocks:  turned rectangles: { kind: shelf | fallen | debris | container | room | corridor | gate | breach | door, at, size: [w, h], angle, label, label_at, mu (true = Mu darkness inside), hidden (true = hidden room), group (blocks with the same group are one element - one tip, one highlight; the last of them carries the tip fields), region, location | lore, note }
#   rails:   crane rails on the ceiling: { points, label, label_t, location | lore, note }
#   roads:   elevated roads: { points, label, fade (true = runs out into the dark), location | lore, note }
#   areas:   structures: { id, name, sub, at, shape: circle | rect, radius | size: [w, h], inner: diamond, color, kind: dark | mu, location | lore, note }
#   markers: points of interest: { id, name, at, icon: elevator | dead | convoy | stairs | stairs-broken | gate | crane | barnacle | dot, label_side: left | below, hide_label, location | lore, note }
#
# Clicking something with location (id in locations.yaml), lore (lore entry id) or a note opens a tip.

sections:
  - id: road
    name: Road to Maroon
    view: [-4, -2.5, 16, 14]
    ground: coolant
    wall_label: Superstructure wall
    labels:
      - { text: "Κ-COOLANT", at: [10.5, 4.6], size: 1.1 }
      - { text: "Κ-COOLANT", at: [1.6, 11.2], size: 1.1 }
    walls:
      - [[-12, 0], [12, 0], [32, 20]]
    roads:
      - id: ice-road
        points: [[0, 0], [8, 8]]
        label: Ice road
        location: ice-road
        note: "Runs barely above the Κ-Coolant sea. Everything on it is frozen; the risk of freezing never goes away."
      - points: [[8, 8], [3.2, 12.8]]
        label: to SB06
        fade: true
      - points: [[8, 8], [12.8, 12.8]]
        label: to SB13
        fade: true
    areas:
      - id: sb14
        name: SB14
        sub: Maroon
        at: [8, 8]
        radius: 1.4
        inner: diamond
        color: "#a20025"
        lore: sb14
        note: "Habitation Maroon. The diamond is the storage hall at road level, where the roads meet (see the Storage map)."
    markers:
      - id: elevator
        name: North Side Elevator
        at: [0, 0]
        icon: elevator
        label_side: below
        note: "The expedition's way in at the North Entry, where the camp is set up."
      - id: dead
        name: Dead people
        at: [2.4, 2.4]
        icon: dead
        location: ice-road
        note: "The convoy's crew, who tried to go on by foot. Proper cold-weather clothing, but not enough against the cold of the Κ-Coolant."
      - id: convoy
        name: Transport
        at: [4.3, 4.3]
        icon: convoy
        location: ice-road
        note: "Transport cars with scrap from Maroon, frozen to the road; they block the way. Still usable: pills, snack bars, a flare gun. The syringes are broken by the frost."

