# Entities: creatures, anomalies and things that are not human.
# Shown on lore/webapp/codex.html?c=entities. One entry per item; entries show in file order.
#
# id:       unique kebab-case id, across ALL lore files. One-shots and other entries link with it.
# name:     display name
# aka:      other names (list)
# kind:     denizen | anomaly | intelligence | swarm
# canon:    confirmed | developer | theory | ours   (see lore/README.md)
# summary:  one line
# details:  list of facts, one line each (Markdown)
# origin:   id of a periphery in peripheries/ (e.g. delta) (optional)
# designation: catalogue number, if it has one
# threat:   one line on how it endangers people (useful at the table)
# related:  ids of other lore entries (any file)
# sources:  where we have it from, one line each
# open:     open questions, one line each

- id: barnacle
  name: Barnacle
  aka: []
  kind: denizen
  canon: confirmed
  summary: "A hostile colonial organism from Periphery Lambda that clings to walls and ceilings and pulls its prey in with tendrils."
  details:
    - "Barnacles are colonial organisms that spread through sporulation. Their spores are highly heat-resistant."
    - "They have no sight organs and rely on magnetoreception and tongue stimulation."
    - "They secrete a toxin that makes them inedible to humans. An attempt to breed out the toxicity and use them as a food source was abandoned."
    - "In Periphery Lambda they sit at the bottom of the food chain."
    - "Their tongues are called tendrils, their bodies veils."
  origin: lambda
  designation: ""
  threat: "Attached to walls or ceilings, they extend tendrils that are harmless to touch until they grab; a grabbed victim is pulled in and eaten. A hard hit on the tendril makes it retract and let go."
  related: [lambda]
  sources:
    - "White Knuckle community wiki: Barnacle (whiteknuckle.miraheze.org/wiki/Barnacle)"
  open: []

- id: mu-beast
  name: Mu beast
  aka: []
  kind: anomaly
  canon: ours
  summary: "Something from the other side of Maroon's PCR that can only move in Mu light and devours what it reaches."
  details:
    - "Let loose in Habitation Maroon by a power surge at the PCR, which flooded the area with Mu light."
    - "It can only move in Mu light. Where it hits a wall of normal light, it cannot get through."
    - "Nobody has really seen it. The photograph of Maroon's PCR, taken on the Mu film, shows a giant eye: the Mu beast."
    - "What it is, is not known."
  origin: mu
  designation: ""
  threat: "It devours rooms one after another; whoever is still in a room when it gets there is killed in one hit."
  related: [mu, sb14, pcr-photograph]
  sources:
    - "Fan-made for The dark side of the room."
  open: []

