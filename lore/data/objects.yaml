# Objects: artifacts, technology, substances and items.
# Shown on lore/webapp/codex.html?c=objects. One entry per item; entries show in file order.
#
# id:       unique kebab-case id, across ALL lore files. One-shots and other entries link with it.
# name:     display name
# aka:      other names (list)
# kind:     artifact | technology | substance | item | document
# canon:    confirmed | developer | theory | ours   (see lore/README.md)
# summary:  one line
# details:  list of facts, one line each (Markdown)
# origin:   id of a periphery in peripheries/ (e.g. delta) (optional)
# designation: catalogue number, if it has one
# related:  ids of other lore entries (any file)
# sources:  where we have it from, one line each
# open:     open questions, one line each

- id: periphery-detector
  name: Periphery detector
  aka: []
  kind: technology
  canon: ours
  summary: "Something like a Geiger counter for shifts in reality, built around a living ear that carries the Rho symbol."
  details:
    - "At its core sits a living ear in glass, marked with the Rho symbol: a Rho-infused item. It works much like the Blink Eye, a non-axial organ."
    - "The ear picks up the peripheries, but not Rho itself: Rho does not want to be listened in on."
    - "It has three charges, and each use spends one. When the charges are gone, the glass is coloured red with blood. It cannot be regenerated."
    - "In Mu light it beeps like a radiation counter."
    - "At the table: turning it on lets the players ask the GM whether something is periphery-based and how far away the next anomaly is. This uses one charge."
  origin: rho
  designation: ""
  related: [rho, mu]
  sources:
    - "Fan-made for The dark side of the room."
    - "Inspired by the Blink Eye (whiteknuckle.miraheze.org/wiki/Blink_Eye)."
  open: []

- id: mu-flashlight
  name: Mu flashlight
  aka: []
  kind: artifact
  canon: ours
  summary: "A flashlight that casts a beam of Mu light, found in the PCR room of Habitation Maroon."
  details:
    - "It creates a beam of Mu light that can be used to blind enemies: shone into their eyes, it turns their whole view black."
    - "Found in the PCR room of Substructure 14 (Habitation Maroon)."
    - "At the table: in The dark side of the room it is just a gimmick; in later one-shots it can be used to blind enemies."
  origin: mu
  designation: ""
  related: [mu, sb14]
  sources:
    - "Fan-made for The dark side of the room."
  open:
    - How does it work?
    - The special interaction with the thing in the dark (see the one-shot).

- id: periphery-scanner
  name: Periphery scanner
  aka: []
  kind: technology
  canon: ours
  summary: "An unlimited periphery scanner that balances Mu light against baseline light, left behind in Habitation Maroon because of its quirks."
  details:
    - "It combines Mu light and baseline light. The two work almost antagonistically against each other, so when the scanner is exposed to a periphery, the balance between them drifts. That drift is what it measures."
    - "Unlike the periphery detector, it is not limited: it needs no charges."
    - "It needs very high precision. It was one of the last experiments in Maroon's Mu research."
    - "It has some quirks, which is why it was left behind when Maroon was abandoned."
    - "A meter shows the reading, from weak to strong periphery energy. When a reading comes out strong, the balance tips and it lets out a short burst of Mu light: a reverse flashbang. For a moment, everything around it goes pitch black."
    - "It can be turned off; switched off, it does not react."
    - "It does not scan passively: a reading has to be started with a button. Each time it tries to read a periphery, it first has to calibrate, which takes a while."
    - "Found in one of the test chambers in Maroon's labs."
  origin: ""
  designation: ""
  related: [mu, baseline, sb14, periphery-detector]
  sources:
    - "Fan-made for The dark side of the room."
  open:
    - Its other quirks, if any.
    - What does it show at the table, and how is it used?

- id: pcr-photograph
  name: Photograph of the PCR
  aka: []
  kind: artifact
  canon: ours
  summary: "A picture of Maroon's PCR, taken on the Mu film. It shows a giant eye that opens when you look at it."
  details:
    - "One of the developed pictures in camera development in Maroon's labs, taken on the film that can capture what is in Mu light."
    - "It does not show the machine. It shows a giant eye."
    - "When a player looks at the picture, the eye opens."
    - "The picture is an artifact in its own right."
  origin: ""
  designation: ""
  related: [mu, sb14]
  sources:
    - "Fan-made for The dark side of the room."
  open:
    - What the eye is, and what happens after it opens.

