name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Stage _site/
        run: |
          mkdir -p _site/one-shots

          # Landing page and shared assets
          cp index.html favicon.svg _site/
          cp -r shared _site/shared
          rm -rf _site/shared/tools

          # Lore — webapp pages + data (fetched at runtime via ../data/)
          mkdir -p _site/lore
          cp -r lore/webapp _site/lore/webapp
          cp -r lore/data   _site/lore/data
          printf '<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=webapp/"><a href="webapp/">Lore</a>' > _site/lore/index.html

          # One-shots — the catalog, then every folder except the template, each with a redirect to its webapp
          cp one-shots/catalog.yaml _site/one-shots/
          for dir in one-shots/*/; do
            name=$(basename "$dir")
            [ "$name" = "_template" ] && continue
            mkdir -p "_site/one-shots/$name"
            cp -r "$dir/webapp" "_site/one-shots/$name/webapp"
            cp -r "$dir/data"   "_site/one-shots/$name/data"
            printf '<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=webapp/"><a href="webapp/">%s</a>' "$name" > "_site/one-shots/$name/index.html"
          done

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
