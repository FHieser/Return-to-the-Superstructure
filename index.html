<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Return to the Superstructure</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="./shared/css/style.css">
  <style>
    .masthead { text-align: center; padding: 3.5rem 1rem 1rem; }
    .masthead h1 { font-size: clamp(2.6rem, 9vw, 5.5rem); line-height: 0.92; margin: 0; letter-spacing: 0.01em; }
    .masthead p { font: 0.75rem var(--mono); letter-spacing: 0.3em; text-transform: uppercase; color: var(--text-dim); margin-top: 0.8rem; }

    /* The lore: the facility wall with its sign, light and exit door */
    .lore-wall { display: flex; flex-direction: column; align-items: center; gap: 1.2rem; text-decoration: none; color: var(--text); margin: 2.5rem auto 3.5rem; padding: 2.2rem 1.5rem 0; max-width: 560px; border: 1px solid var(--line); border-bottom: none; background: linear-gradient(rgba(10, 10, 10, 0.55), rgba(10, 10, 10, 0.85)); }
    .lore-wall:hover { color: var(--text); text-shadow: none; }
    .lore-wall .plate { font-size: clamp(2.4rem, 8vw, 3.6rem); text-align: center; }
    .lore-wall .tagline { font-style: italic; color: #a8a8a8; text-align: center; max-width: 420px; }
    .lore-wall .counts { font: 0.72rem var(--mono); color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; text-align: center; }
    .exit-sign { font: 1rem var(--display); letter-spacing: 0.15em; color: #9a9a94; border: 1px solid #444; padding: 0.1rem 0.6rem; background: #1c1c1c; }
    .exit-door { width: 150px; height: 190px; border: 6px solid #3c3c3c; border-bottom: none; background: linear-gradient(#101010, #050505 70%, #2a0c0a); display: flex; align-items: center; justify-content: center; font: 0.75rem var(--mono); letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-dim); transition: color 0.15s, box-shadow 0.15s; box-shadow: inset 0 0 30px #000; }
    .lore-wall:hover .exit-door { color: var(--text-bright); box-shadow: inset 0 0 30px #000, 0 0 30px rgba(255, 255, 255, 0.08); }

    /* The expedition: a freight elevator. The closed doors are the whole card, the title stencilled across
       the seam; hover splits them open on the shaft wall rushing upwards, with the one-shots inside. */
    .lift-card { display: flex; flex-direction: column; max-width: 560px; margin: 0 auto 3.5rem; text-decoration: none; color: var(--text);
      background: #121211; border: 1px solid #2a2a28; box-shadow: 0 0 0 1px #050505, 0 20px 50px rgba(0, 0, 0, 0.6); }
    .lift-card:hover { color: var(--text); text-shadow: none; }
    /* The lintel: steel with rivets and the floor display */
    .lift-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.7rem 1.1rem;
      background: radial-gradient(circle, #4a4a46 0 2px, transparent 2.5px) 0 0 / 22px 22px repeat-x, linear-gradient(#262624, #1a1a19);
      background-position: 9px 7px, 0 0; border-bottom: 3px solid #070707; }
    .lift-head .lift-sub { font: 0.68rem var(--mono); letter-spacing: 0.22em; text-transform: uppercase; color: #8a8a84; }
    .lift-display { display: inline-flex; align-items: center; gap: 0.55rem; padding: 0.25rem 0.7rem; background: #050505; border: 2px solid #333;
      box-shadow: inset 0 0 10px #000; font: 700 1.05rem var(--mono); color: #3a3428; letter-spacing: 0.08em; }
    .lift-card:hover .lift-display, .lift-card:focus-visible .lift-display { color: #e8d9a8; text-shadow: 0 0 6px rgba(232, 200, 120, 0.6); }
    .lift-card:hover .lift-arrow, .lift-card:focus-visible .lift-arrow { animation: lift-blink 0.9s steps(1) infinite; }
    @keyframes lift-blink { 50% { opacity: 0.25; } }
    /* The opening, framed by the posts */
    .lift-opening { position: relative; height: 400px; margin: 0 14px; overflow: hidden; background: #050505; box-shadow: inset 0 0 0 2px #070707; }
    .lift-shaft { position: absolute; inset: 0; overflow: hidden; }
    .lift-shaft::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, transparent 30%, rgba(0, 0, 0, 0.85) 100%); }
    /* The shaft wall, 240px taller than the opening; every pattern repeats within 240px, so the loop is seamless */
    .lift-pan { position: absolute; left: 0; right: 0; top: 0; height: calc(100% + 240px); animation: lift-drive 0.6s linear infinite paused;
      background:
        linear-gradient(#66665f 0 5px, #2a2a2a 5px 40px) left 4px top 0 / 12px 40px repeat-y,      /* guide rails with their brackets */
        linear-gradient(#66665f 0 5px, #2a2a2a 5px 40px) right 4px top 0 / 12px 40px repeat-y,
        linear-gradient(rgba(0, 0, 0, 0.6) 0 2px, transparent 2px 60px) 0 0 / 100% 60px,          /* panel seams */
        linear-gradient(90deg, transparent calc(33% - 1px), rgba(0, 0, 0, 0.45) calc(33% - 1px) calc(33% + 1px), transparent calc(33% + 1px) calc(67% - 1px), rgba(0, 0, 0, 0.45) calc(67% - 1px) calc(67% + 1px), transparent calc(67% + 1px)),
        url('./shared/css/dither.png'), #1e1e1d; }
    .lift-floor { position: absolute; left: 16px; right: 16px; height: 34px; border-top: 4px solid #070707; border-bottom: 8px solid #070707;
      background: repeating-linear-gradient(45deg, #8f8048 0 10px, #141414 10px 20px); opacity: 0.7; }
    .lift-sparks { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
    .lift-card:hover .lift-pan, .lift-card:focus-visible .lift-pan { animation-play-state: running; }
    @keyframes lift-drive { to { transform: translateY(-240px); } }
    /* Inside the car: what waits below */
    .lift-inside { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.9rem; padding: 2rem 3rem; text-align: center;
      opacity: 0; transition: opacity 0.2s; }
    .lift-inside > span { background: rgba(5, 5, 5, 0.78); padding: 0.3rem 0.8rem; }
    .lift-inside .lift-level { font: 0.7rem var(--mono); letter-spacing: 0.3em; text-transform: uppercase; color: #e8d9a8; }
    .lift-inside .tagline { font-style: italic; color: #c8c8c2; max-width: 380px; }
    .lift-inside .counts { font: 0.72rem var(--mono); color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; }
    .lift-inside .lift-enter { font: 1rem var(--display); letter-spacing: 0.15em; color: #f4f4ec; border: 1px solid #5a5a54; }
    .lift-card:hover .lift-inside, .lift-card:focus-visible .lift-inside { opacity: 1; transition: opacity 0.4s 0.55s; }
    /* The doors: ribbed steel. Each door shows its half of one shared face (title, hazard band), so the paint splits at the seam. */
    .lift-door { position: absolute; top: 0; bottom: 0; width: 50%; z-index: 3; overflow: hidden; transition: transform 0.85s cubic-bezier(0.6, 0, 0.3, 1);
      background: repeating-linear-gradient(rgba(255, 255, 255, 0.04) 0 2px, transparent 2px 44px, rgba(0, 0, 0, 0.4) 44px 47px), linear-gradient(90deg, #232322, #31312e 50%, #242423); }
    .lift-door.left { left: 0; box-shadow: inset -2px 0 0 #080808; }
    .lift-door.right { right: 0; box-shadow: inset 2px 0 0 #3e3e3a; }
    .lift-face { position: absolute; top: 0; bottom: 0; width: 200%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.6rem; }
    .lift-door.left .lift-face { left: 0; }
    .lift-door.right .lift-face { right: 0; }
    .lift-stencil { font: clamp(2.6rem, 9vw, 4rem)/0.95 var(--display); text-transform: uppercase; letter-spacing: 0.04em; color: #c9c9c1; text-align: center;
      opacity: 0.82; mix-blend-mode: screen; -webkit-mask: url('./shared/css/dither.png'); mask: url('./shared/css/dither.png'); }
    .lift-face .lift-sre { font: 700 0.8rem var(--mono); letter-spacing: 0.4em; color: #8f8f88; }
    .lift-face .lift-hazard { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; border-top: 3px solid #090909;
      background: repeating-linear-gradient(-45deg, #8f8048 0 12px, #151515 12px 24px); opacity: 0.8; }
    .lift-face .lift-hazard.top { top: 0; bottom: auto; height: 14px; border-top: none; border-bottom: 3px solid #090909; }
    .lift-card:hover .lift-door.left, .lift-card:focus-visible .lift-door.left { transform: translateX(-100%); transition-delay: 0.1s; }
    .lift-card:hover .lift-door.right, .lift-card:focus-visible .lift-door.right { transform: translateX(100%); transition-delay: 0.1s; }
    .lift-sill { height: 14px; margin: 0 14px; background: repeating-linear-gradient(90deg, #3a3a36 0 3px, #1c1c1b 3px 8px); border-top: 2px solid #4a4a46; }
    @media (prefers-reduced-motion: reduce) {
      .lift-pan, .lift-card:hover .lift-arrow { animation: none; }
      .lift-door, .lift-card:hover .lift-inside { transition: none; }
    }
  </style>
</head>
<body>
  <div class="masthead">
    <h1>Return to the<br>Superstructure</h1>
    <p>Pen &amp; paper one-shots in the world of White Knuckle</p>
  </div>

  <main>
    <a class="lore-wall" id="lore-card" href="./lore/webapp/">
      <span class="plate"><span id="lore-title">The Superstructure</span><span class="plate-sub" id="lore-sub">Lore</span></span>
      <span class="strip-light"><i></i><i></i><i></i><i></i></span>
      <span class="tagline" id="lore-tagline"></span>
      <span class="counts" id="lore-counts"></span>
      <span class="exit-sign">ENTER</span>
      <span class="exit-door">The Lore</span>
    </a>

    <a class="lift-card" id="lift-card" href="./expedition/webapp/">
      <span class="lift-head">
        <span class="lift-sub">Service lift &middot; North Entry</span>
        <span class="lift-display"><span class="lift-arrow">&#9660;</span><span id="lift-floor-no">00</span></span>
      </span>
      <span class="lift-opening">
        <span class="lift-shaft" aria-hidden="true">
          <span class="lift-pan"><i class="lift-floor" style="top: 150px"></i><i class="lift-floor" style="top: 390px"></i></span>
          <canvas class="lift-sparks"></canvas>
        </span>
        <span class="lift-inside">
          <span class="lift-level">Level &middot; One-Shots</span>
          <span class="tagline" id="lift-tagline"></span>
          <span class="counts" id="lift-counts"></span>
          <span class="lift-enter">Enter</span>
        </span>
        <span class="lift-door left"><span class="lift-face"><i class="lift-hazard top"></i><span class="lift-stencil lift-title">The<br>Expedition</span><span class="lift-sre">SRE &middot; One-Shots</span><i class="lift-hazard"></i></span></span>
        <span class="lift-door right"><span class="lift-face"><i class="lift-hazard top"></i><span class="lift-stencil lift-title">The<br>Expedition</span><span class="lift-sre">SRE &middot; One-Shots</span><i class="lift-hazard"></i></span></span>
      </span>
      <span class="lift-sill"></span>
    </a>
  </main>


  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <script src="./shared/js/core.js"></script>
  <script>
    async function initLanding() {
      const [lore, { collections }, shots, expedition] = await Promise.all([
        fetchYaml('./lore/data/overview.yaml'), loadLore(), loadCatalog(), fetchYaml('./expedition/data/expedition.yaml'),
      ]);
      if (lore) {
        if (has(lore.title)) document.getElementById('lore-title').textContent = lore.title;
        if (has(lore.subtitle)) document.getElementById('lore-sub').textContent = lore.subtitle;
        document.getElementById('lore-tagline').innerHTML = mdInline(lore.tagline);
      }
      const total = LORE_COLLECTIONS.reduce((n, c) => n + collections[c.id].length, 0);
      document.getElementById('lore-counts').textContent = total
        ? LORE_COLLECTIONS.map(c => `${collections[c.id].length} ${c.label}`).join(' · ')
        : 'The source of truth. Not written yet.';

      const x = expedition || {};
      if (has(x.title)) document.querySelectorAll('.lift-title').forEach(t => { t.innerHTML = x.title.replace(' ', '<br>'); });   // two lines across the doors
      document.getElementById('lift-tagline').innerHTML = mdInline(x.tagline);
      const count = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
      document.getElementById('lift-counts').textContent = [
        count(shots.length, 'one-shot'), count((x.npcs || []).length, 'NPC'),
        count((x.places || []).length, 'place'), count((x.items || []).length, 'item'),
      ].join(' · ');
    }
    runPage(initLanding);

    // The elevator: hovering opens the doors on a shaft wall rushing upwards, and now and then
    // sparks fly off the guide rails. Leaving closes the doors and lets the last sparks die out.
    (function liftSparks() {
      const card = document.getElementById('lift-card');
      const canvas = card.querySelector('.lift-sparks');
      const ctx = canvas.getContext('2d');
      const GRAVITY = 0.0011;   // px/ms²
      let sparks = [], flashes = [], active = false, running = false, nextBurst = 0, last = 0, W = 0, H = 0;

      function size() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = canvas.clientWidth; H = canvas.clientHeight;
        canvas.width = W * dpr; canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      // A spray off one rail: up and away from it, as the car scrapes down past it
      function burst(now) {
        const left = Math.random() < 0.5;
        const x = left ? 16 : W - 16, y = H * (0.12 + Math.random() * 0.7);
        const n = 14 + Math.floor(Math.random() * 26);
        for (let i = 0; i < n; i++) sparks.push({
          x, y, born: now, life: 220 + Math.random() * 520,
          vx: (left ? 1 : -1) * (0.04 + Math.random() * 0.32),
          vy: -(0.06 + Math.random() * 0.42),
        });
        flashes.push({ x, y, born: now });
        nextBurst = now + (Math.random() < 0.25 ? 90 : 450 + Math.random() * 1900);   // sometimes a second one right after
      }

      function frame(now) {
        const dt = Math.min(40, now - last);
        last = now;
        if (active && now >= nextBurst) burst(now);
        ctx.clearRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'lighter';
        flashes = flashes.filter(f => now - f.born < 140);
        for (const f of flashes) {
          const a = 0.45 * (1 - (now - f.born) / 140);
          const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 46);
          g.addColorStop(0, `rgba(255, 220, 160, ${a})`);
          g.addColorStop(1, 'rgba(255, 160, 60, 0)');
          ctx.fillStyle = g;
          ctx.fillRect(f.x - 46, f.y - 46, 92, 92);
        }
        sparks = sparks.filter(s => now - s.born < s.life);
        ctx.lineCap = 'round';
        for (const s of sparks) {
          s.vy += GRAVITY * dt;
          s.x += s.vx * dt; s.y += s.vy * dt;
          const t = (now - s.born) / s.life;   // 0 → 1: white-hot, then orange, then gone
          ctx.strokeStyle = `hsla(${48 - 28 * t}, 100%, ${92 - 40 * t}%, ${1 - t})`;
          ctx.lineWidth = 1.4 - 0.6 * t;
          ctx.beginPath();
          ctx.moveTo(s.x - s.vx * 22, s.y - s.vy * 22);
          ctx.lineTo(s.x, s.y);
          ctx.stroke();
        }
        if (active || sparks.length || flashes.length) requestAnimationFrame(frame);
        else running = false;
      }

      function start() {
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        active = true;
        if (running) return;
        size();
        running = true;
        last = performance.now();
        nextBurst = last + 300 + Math.random() * 400;   // the doors are opening first
        requestAnimationFrame(frame);
      }
      // The floor display counts down while the car is moving
      const floorNo = document.getElementById('lift-floor-no');
      let floor = 0, floorTimer = null;
      function drive() {
        clearInterval(floorTimer);
        floorTimer = setInterval(() => { floor--; floorNo.textContent = '-' + String(-floor).padStart(2, '0'); }, 900);
      }
      card.addEventListener('mouseenter', drive);
      card.addEventListener('focus', drive);

      const stop = () => { active = false; clearInterval(floorTimer); };
      card.addEventListener('mouseenter', start);
      card.addEventListener('focus', start);
      card.addEventListener('mouseleave', stop);
      card.addEventListener('blur', stop);
    })();
  </script>
</body>
</html>
